name: Run Telegram Video Downloader Bot

on:
  workflow_dispatch:

concurrency:
  group: telegram-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    # ubuntu-latest = 26.04 (apt mirror slow + Cloudflare WARP repo unsupported) -> 24.04 pin
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout Repo Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # apt ke 89 packages ki jagah static ffmpeg (~15 sec). Fail ho to apt fallback.
      - name: Install FFmpeg (static)
        timeout-minutes: 8
        run: |
          set -e
          mkdir -p "$HOME/bin"
          if curl -fsSL --retry 3 --connect-timeout 15 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xf /tmp/ff.tar.xz -C /tmp; then
            cp /tmp/ffmpeg-*/bin/ffmpeg /tmp/ffmpeg-*/bin/ffprobe "$HOME/bin/"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          else
            echo "Static ffmpeg fail - apt fallback"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      # Sirf jo libs missing hon wahi install (zyadatar runner par pehle se hoti hain)
      - name: Install Missing System Libs
        timeout-minutes: 5
        run: |
          MISSING=""
          for p in libglib2.0-0t64 libsm6 libxext6 libgomp1 libgl1 fonts-noto-color-emoji fonts-dejavu-core; do
            dpkg -s "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"
          done
          if [ -n "$MISSING" ]; then
            echo "Installing:$MISSING"
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 $MISSING
          else
            echo "All system libs already present."
          fi

      - name: Install Python Packages
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade "yt-dlp[default,curl-cffi]"

      - name: Cache Playwright Browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install chromium
          fi
          python -m playwright install-deps chromium

      - name: Cache Censor Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: censor-models-v1

      # APK builds (/buildapp) ke liye Gradle libraries cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1
          restore-keys: gradle-${{ runner.os }}-

      - name: Warm-up Censor Models
        timeout-minutes: 10
        run: |
          python -c "import modules.censor_engine as c; c._load(); print('Censor backends:', c.censor_backends())"

      - name: Fallback Proxy (Cloudflare WARP)
        continue-on-error: true
        timeout-minutes: 5
        env:
          SECRET_PROXY: ${{ secrets.FALLBACK_PROXY }}
        run: |
          if [ -n "$SECRET_PROXY" ]; then
            echo "FALLBACK_PROXY=$SECRET_PROXY" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          # poora apt update nahi - sirf Cloudflare repo refresh (fast)
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/cloudflare-client.list" \
            -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y --no-install-recommends cloudflare-warp
          sudo systemctl enable --now warp-svc || true
          sleep 3
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos set-mode proxy || warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            if curl -s -m 5 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp="; then
              echo "FALLBACK_PROXY=socks5h://127.0.0.1:40000" >> "$GITHUB_ENV"
              echo "WARP proxy ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Setup Cookies
        env:
          COOKIES_DATA: ${{ secrets.COOKIES }}
        run: |
          if [ -n "$COOKIES_DATA" ]; then
            echo "$COOKIES_DATA" > cookies.txt
            echo "cookies.txt created."
          else
            echo "No cookies secret, skipping."
          fi

      - name: Start Modular Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TEXT_WINDOW: '1.8'
          CENSOR_STYLE: 'sticker'
          CENSOR_MAX_SEC: '180'
          CENSOR_BUDGET_SEC: '360'
        run: python bot.py
