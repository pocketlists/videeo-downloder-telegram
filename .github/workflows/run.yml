name: Run Telegram Video Downloader Bot

on:
  schedule:
    # Har 5 ghante mein auto-restart (GitHub Actions timeout limit bypass karne ke liye)
    - cron: '0 */5 * * *'
  workflow_dispatch: # GitHub dashboard se manual start karne ke liye

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: Install Python Packages & Update yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp

      - name: Create cookies.txt (If secret exists)
        run: |
          if [ -n "$COOKIES_DATA" ]; then
            echo "$COOKIES_DATA" > cookies.txt
            echo "cookies.txt file created."
          fi
        env:
          COOKIES_DATA: ${{ secrets.COOKIES }}

      - name: Start Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
